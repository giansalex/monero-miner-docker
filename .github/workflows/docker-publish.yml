name: Docker Publish

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .build/**
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - .build/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  IMAGE_NAME: giansalex/monero-miner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read XMRig version from Dockerfile
        id: version
        run: |
          version=$(sed -n "s/^ARG XMRIG_VERSION='\(.*\)'/\1/p" Dockerfile)
          if [ -z "$version" ]; then
            echo "Could not read XMRIG_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "xmrig=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only check that the image builds (amd64, no push).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.xmrig }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
